        <!-- Service Worker Registration with Auto-Update -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', async function() {
                    try {
                        const registration = await navigator.serviceWorker.register('/service-worker.js');
                        console.log('Nevika Cura PWA: SW registered');
                        
                        // Check for updates periodically (every 30 min)
                        setInterval(() => registration.update(), 30 * 60 * 1000);

                        // New SW found
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                }
                            });
                        });

                        // When new SW takes control, reload for fresh content
                        let refreshing = false;
                        navigator.serviceWorker.addEventListener('controllerchange', () => {
                            if (!refreshing) { refreshing = true; window.location.reload(); }
                        });

                        // Listen for messages from SW
                        navigator.serviceWorker.addEventListener('message', (event) => {
                            if (event.data?.type === 'SW_UPDATED') {
                                console.log('Nevika Cura: App updated to v' + event.data.version);
                            }
                            if (event.data?.type === 'CACHE_CLEARED') {
                                console.log('Nevika Cura: Cache cleared, reloading...');
                                window.location.reload(true);
                            }
                        });

                        // Activate waiting SW immediately
                        if (registration.waiting) {
                            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                        }

                    } catch (error) {
                        console.log('Nevika Cura PWA: SW registration failed:', error);
                    }
                });
            }
