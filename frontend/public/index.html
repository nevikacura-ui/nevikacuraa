            html, body {

            #splash-screen {

            }

                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: relative;
            }

                width: 320px;
                height: 320px;

                max-width: 85vw;
                width: auto;
                height: auto;
                object-fit: contain;
                border-radius: 0;
            }
            /* Disappearing Icons Animation */
            .icon-loader {
                margin-top: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
                width: 60px;
                height: 60px;
            }
            .icon-item {
                position: absolute;
                width: 50px;
                height: 50px;
                border-radius: 14px;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
                transform: scale(0.6);
                animation: icon-cycle 3s ease-in-out infinite;
            }
            .icon-item svg {
                width: 26px;
                height: 26px;
                color: white;
            }
            .icon-item:nth-child(1) {
                background: linear-gradient(135deg, #f97316, #ec4899);
                animation-delay: 0s;
            }
            .icon-item:nth-child(2) {
                background: linear-gradient(135deg, #3b82f6, #6366f1);
                animation-delay: 1s;
            }
            .icon-item:nth-child(3) {
                background: linear-gradient(135deg, #8b5cf6, #ec4899);
                animation-delay: 2s;
            }
            @keyframes icon-cycle {
                0% { opacity: 0; transform: scale(0.6) translateY(10px); }
                10% { opacity: 1; transform: scale(1) translateY(0); }
                30% { opacity: 1; transform: scale(1) translateY(0); }
                40% { opacity: 0; transform: scale(0.6) translateY(-10px); }
                100% { opacity: 0; transform: scale(0.6) translateY(-10px); }
            }
        </style>

        <script>

                        const registration = await navigator.serviceWorker.register('/service-worker.js');

                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            console.log('Nevika Cura PWA: New service worker installing...');
                            
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New SW installed, skip waiting
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
